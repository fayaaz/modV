name: Nightly Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux nightly
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Compute nightly version
        run: |
          DATE=$(date -u +%Y%m%d)
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          echo "APP_VERSION=$BASE-nightly.$DATE" >> "$GITHUB_ENV"
          echo "NIGHTLY_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deb and AppImage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifacts
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=linux
          cache-to: type=gha,mode=max,scope=linux

      - name: Publish nightly release
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --target main \
            --prerelease \
            --title "Nightly $NIGHTLY_DATE" \
            --notes "Automated nightly build from \`main\` ($NIGHTLY_DATE). Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            dist/*.AppImage dist/*.deb
