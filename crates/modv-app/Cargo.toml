[package]
name = "modv-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "modV engine binary — see docs/rust-hybrid.md"
default-run = "modv-engine"

[[bin]]
name = "modv-engine"
path = "src/main.rs"

[dependencies]
clap = "4.6.7"
image = "0.25.10"
modv-engine = { path = "../modv-engine" }
modv-ipc = { path = "../modv-ipc" }
modv-render = { version = "0.1.0", path = "../modv-render" }
modv-renderers = { version = "0.1.0", path = "../modv-renderers" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
winit = "0.30.13"
