[package]
name = "modv-renderers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "modV engine — see docs/rust-hybrid.md"

[dependencies]
bytemuck = "1.25.2"
cosmic-text = "0.14"
indexmap = { version = "2", features = ["serde"] }
naga = { version = "30.0.1", features = ["glsl-in", "spv-in", "spv-out", "wgsl-in", "wgsl-out"] }
serde_json = "1"
wgpu = "30.0.1"
