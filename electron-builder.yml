appId: gl.vcync.vmodv
productName: VmodV
directories:
  buildResources: resources
# The Rust engine ships outside the asar so its executable bit survives (see
# docs/rust-hybrid.md, WS-14). Built by the `engine-build` Docker stage.
extraResources:
  - from: crates/target/release/modv-engine
    to: modv-engine
  # The engine reads the ISF corpus as plain files (it scans the directory at
  # startup), so it must live outside the asar; `--isf-dir` points here in a
  # packaged build (src/main/engine-supervisor.js).
  - from: src/renderer/src/application/renderers/isf/modules/isf
    to: isf
  # Point10 scene textures (tinore maps, panoramas, PCB, water normals, ...).
  # The engine resolves them via `$MODV_ASSETS_DIR` (src/main/engine-supervisor.js);
  # a missing file falls back to a procedural placeholder.
  - from: src/renderer/src/application/point10/textures
    to: textures
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!tests/*'
  - '!patches/*'
  # macOS-only haptics ship a 147 MB Xcode DerivedData tree. It is re-included
  # for mac builds below. The NDI SDK is only needed while compiling grandiose;
  # at runtime the addon loads the copy in build/Release.
  - '!node_modules/hapticjs/hapticJS/**'
  - '!node_modules/grandiose/ndi/**'
asarUnpack:
  - resources/**
  - node_modules/grandiose
  - node_modules/ffmpeg-fluent
win:
  executableName: VmodV
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  files:
    - 'node_modules/hapticjs/hapticJS/**'
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSScreenCaptureUsageDescription: Application requests access to the user's screen.
  notarize: true
  singleArchFiles: "node_modules/grandiose/**"
dmg:
  artifactName: ${name}-${version}.${ext}
  sign: false
linux:
  target:
    - AppImage
    - deb
  maintainer: VmodV <vmodv@users.noreply.github.com>
  category: Graphics
  electronLanguages:
    - en-US
appImage:
  artifactName: ${productName}-${version}.${ext}
  # AppImages cannot install the setuid chrome-sandbox helper, and some distros
  # disable unprivileged user namespaces, so Electron aborts on launch. Pass
  # --no-sandbox by default for the AppImage only; the .deb keeps the SUID
  # sandbox that its post-install script configures.
  executableArgs:
    - --no-sandbox
deb:
  artifactName: ${productName}-${version}.${ext}
  # The engine (MODV_ENGINE=1) links libpipewire-0.3 for engine-owned
  # system-audio capture. Keep electron-builder's default set and add it.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libpipewire-0.3-0
    # Engine-owned video capture (MODV_ENGINE=1, WS-10) uses GStreamer:
    # cameras need v4l2src (plugins-good), files uridecodebin + decoders
    # (plugins-base/libav), screens pipewiresrc (pipewire). The engine degrades
    # to a media_plugin_missing error without them.
    - libgstreamer1.0-0
    - libgstreamer-plugins-base1.0-0
    - gstreamer1.0-plugins-base
    - gstreamer1.0-plugins-good
    - gstreamer1.0-libav
npmRebuild: false
# publish:
#   provider: github
#   channel: "prerelease"
#   vPrefixedTagName: false
