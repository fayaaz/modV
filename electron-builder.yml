appId: gl.vcync.modv
productName: modV
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!tests/*'
  - '!patches/*'
  # macOS-only haptics ship a 147 MB Xcode DerivedData tree. It is re-included
  # for mac builds below. The NDI SDK is only needed while compiling grandiose;
  # at runtime the addon loads the copy in build/Release.
  - '!node_modules/hapticjs/hapticJS/**'
  - '!node_modules/grandiose/ndi/**'
asarUnpack:
  - resources/**
  - node_modules/grandiose
  - node_modules/ffmpeg-fluent
win:
  executableName: modV
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  files:
    - 'node_modules/hapticjs/hapticJS/**'
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSScreenCaptureUsageDescription: Application requests access to the user's screen.
  notarize: true
  singleArchFiles: "node_modules/grandiose/**"
dmg:
  artifactName: ${name}-${version}.${ext}
  sign: false
linux:
  target:
    - AppImage
    - deb
  maintainer: modv.vcync.gl
  category: Graphics
  electronLanguages:
    - en-US
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
